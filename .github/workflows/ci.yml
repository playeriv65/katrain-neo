name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FLUTTER_VERSION: "3.47.7"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format
        run: dart format --output=none --set-exit-if-changed packages app/lib app/test
      - name: Core analyze and test
        working-directory: packages/katrain_core
        run: |
          dart analyze --fatal-infos
          dart test
      - name: CLI analyze and test
        working-directory: packages/katrain_cli
        run: |
          dart analyze --fatal-infos
          dart test
      - name: App analyze and test
        working-directory: app
        run: |
          flutter analyze --fatal-infos
          flutter test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: macos
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Linux build dependencies
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev clang cmake pkg-config libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - run: flutter pub get
      - name: Build
        working-directory: app
        run: flutter build ${{ matrix.target }} --release
