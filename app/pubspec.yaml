name: katrain_neo
description: "KaTrain Neo: review Go games with KataGo, play calibrated AIs, learn in teaching mode."
publish_to: 'none'
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  archive: ^4.5.2
  audioplayers: ^6.8.1
  desktop_drop: ^0.8.4
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  katrain_core:
    path: ../packages/katrain_core
  screen_retriever: ^0.2.2
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/img/
    - assets/sounds/
    - assets/katago/
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
