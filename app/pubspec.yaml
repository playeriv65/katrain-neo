name: katrain_neo
description: "KaTrain Neo: an unofficial Flutter rewrite of KaTrain"
publish_to: 'none'
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  archive: ^4.5.2
  audioplayers: ^6.8.1
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  katrain_core:
    path: ../packages/katrain_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/img/
    - assets/sounds/
    - assets/katago/
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
